services:
  db:
    image: postgres:16
    container_name: fieldflow_db
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ../codigo/Back
    container_name: fieldflow_api
    env_file:
      - ../.env  # Passa todas as variáveis para dentro do container da API
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: